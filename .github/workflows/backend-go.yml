name: Backend CI/CD

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-go.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'apps/backend/**'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Install dependencies
        working-directory: apps/backend
        run: go mod download

      - name: Run unit tests
        working-directory: apps/backend
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/backend/coverage.out
          flags: backend-unit
          name: backend-unit-coverage

      - name: Run linter
        working-directory: apps/backend
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: landly_test
          POSTGRES_PASSWORD: landly_test
          POSTGRES_DB: landly_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          
          # Wait for MinIO to be ready
          timeout 30 bash -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'

      - name: Install dependencies
        working-directory: apps/backend
        run: go mod download

      - name: Run integration tests
        working-directory: apps/backend
        env:
          TEST_POSTGRES_HOST: localhost
          TEST_POSTGRES_PORT: 5432
          TEST_POSTGRES_USER: landly_test
          TEST_POSTGRES_PASSWORD: landly_test
          TEST_POSTGRES_DB: landly_test
          TEST_REDIS_ADDR: localhost:6379
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: 6379
          TEST_S3_ENDPOINT: localhost:9000
          TEST_S3_ACCESS_KEY: minioadmin
          TEST_S3_SECRET_KEY: minioadmin
          TEST_S3_USE_SSL: "false"
        run: go test -v -tags=integration -coverprofile=coverage-integration.out ./...

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/backend/coverage-integration.out
          flags: backend-integration
          name: backend-integration-coverage

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build-push.outputs.digest }}
      image_repo: ${{ steps.vars.outputs.ycr_repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          echo "lowercase_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "ycr_repo=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ secrets.YCR_REPOSITORY }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo "/opt/yc/bin" >> $GITHUB_PATH

      - name: Login to Yandex Container Registry
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}' > /tmp/yc-key.json
          /opt/yc/bin/yc config set service-account-key /tmp/yc-key.json
          /opt/yc/bin/yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          IAM_TOKEN=$(/opt/yc/bin/yc iam create-token)
          echo "${IAM_TOKEN}" | docker login --username iam --password-stdin cr.yandex
          rm -f /tmp/yc-key.json

      - name: Build and push to GHCR and YCR
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.lowercase_owner }}/landly/backend:main
            ghcr.io/${{ steps.vars.outputs.lowercase_owner }}/landly/backend:sha-${{ github.sha }}
            ${{ steps.vars.outputs.ycr_repo }}:main
            ${{ steps.vars.outputs.ycr_repo }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **YCR Image:** \`${{ steps.vars.outputs.ycr_repo }}@${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo "/opt/yc/bin" >> $GITHUB_PATH

      - name: Authenticate with Yandex Cloud
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}' > /tmp/yc-key.json
          /opt/yc/bin/yc config set service-account-key /tmp/yc-key.json
          /opt/yc/bin/yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          rm -f /tmp/yc-key.json

      - name: Deploy new revision to Serverless Container
        run: |
          # Use immutable image reference (digest)
          IMAGE="${{ needs.build.outputs.image_repo }}@${{ needs.build.outputs.image_digest }}"
          
          echo "Deploying image: ${IMAGE}"
          
          # Create new container revision with all env vars
          /opt/yc/bin/yc serverless container revision deploy \
            --container-id ${{ secrets.YC_CONTAINER_ID }} \
            --image "${IMAGE}" \
            --service-account-id ${{ secrets.YC_SERVICE_ACCOUNT_ID }} \
            --execution-timeout 30s \
            --memory 512MB \
            --cores 1 \
            --concurrency 16 \
            --min-instances 0 \
            --environment "LANDLY_APP_ENV=production" \
            --environment "LANDLY_BOOTSTRAP_MODE=0" \
            --environment "LANDLY_AUTH_JWT_SECRET=${{ secrets.LANDLY_AUTH_JWT_SECRET }}" \
            --environment "LANDLY_DATABASE_POSTGRES_HOST=${{ secrets.LANDLY_DATABASE_POSTGRES_HOST }}" \
            --environment "LANDLY_DATABASE_POSTGRES_PORT=${{ secrets.LANDLY_DATABASE_POSTGRES_PORT }}" \
            --environment "LANDLY_DATABASE_POSTGRES_USER=${{ secrets.LANDLY_DATABASE_POSTGRES_USER }}" \
            --environment "LANDLY_DATABASE_POSTGRES_PASSWORD=${{ secrets.LANDLY_DATABASE_POSTGRES_PASSWORD }}" \
            --environment "LANDLY_DATABASE_POSTGRES_DBNAME=${{ secrets.LANDLY_DATABASE_POSTGRES_DBNAME }}" \
            --environment "LANDLY_DATABASE_POSTGRES_SSLMODE=${{ secrets.LANDLY_DATABASE_POSTGRES_SSLMODE }}" \
            --environment "LANDLY_STORAGE_S3_ENDPOINT=${{ secrets.LANDLY_STORAGE_S3_ENDPOINT }}" \
            --environment "LANDLY_STORAGE_S3_BUCKET=${{ secrets.LANDLY_STORAGE_S3_BUCKET }}" \
            --environment "LANDLY_STORAGE_S3_ACCESS_KEY=${{ secrets.LANDLY_STORAGE_S3_ACCESS_KEY }}" \
            --environment "LANDLY_STORAGE_S3_SECRET_KEY=${{ secrets.LANDLY_STORAGE_S3_SECRET_KEY }}" \
            --environment "LANDLY_STORAGE_S3_USE_SSL=true" \
            --environment "LANDLY_SERVER_CORS_ALLOWED_ORIGINS=${{ secrets.LANDLY_SERVER_CORS_ALLOWED_ORIGINS }}" \
            --environment "LANDLY_APP_BASE_URL=${{ secrets.STAGING_URL }}"

      - name: Wait for revision to be active
        run: |
          echo "Waiting 15 seconds for revision to become active..."
          sleep 15

      - name: Smoke test - Health check
        run: |
          echo "Testing health endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_URL }}/health")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Health check failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Health check passed (HTTP $HTTP_STATUS)"

      - name: Smoke test - Readiness check
        run: |
          echo "Testing readiness endpoint..."
          RESPONSE=$(curl -s "${{ secrets.STAGING_URL }}/readyz")
          echo "Response: $RESPONSE"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_URL }}/readyz")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "⚠️ Readiness check returned $HTTP_STATUS (may be expected if DB not connected)"
          else
            echo "✅ Readiness check passed (HTTP $HTTP_STATUS)"
          fi

      - name: Deployment summary
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Container ID:** \`${{ secrets.YC_CONTAINER_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Digest:** \`${{ needs.build.outputs.image_digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ secrets.STAGING_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
