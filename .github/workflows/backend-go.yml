name: Backend CI/CD

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-go.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'apps/backend/**'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Install dependencies
        working-directory: apps/backend
        run: go mod download

      - name: Run unit tests
        working-directory: apps/backend
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/backend/coverage.out
          flags: backend-unit
          name: backend-unit-coverage

      - name: Run linter
        working-directory: apps/backend
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: landly_test
          POSTGRES_PASSWORD: landly_test
          POSTGRES_DB: landly_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          
          # Wait for MinIO to be ready
          timeout 30 bash -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'

      - name: Install dependencies
        working-directory: apps/backend
        run: go mod download

      - name: Run integration tests
        working-directory: apps/backend
        env:
          TEST_POSTGRES_HOST: localhost
          TEST_POSTGRES_PORT: 5432
          TEST_POSTGRES_USER: landly_test
          TEST_POSTGRES_PASSWORD: landly_test
          TEST_POSTGRES_DB: landly_test
          TEST_REDIS_ADDR: localhost:6379
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: 6379
          TEST_S3_ENDPOINT: localhost:9000
          TEST_S3_ACCESS_KEY: minioadmin
          TEST_S3_SECRET_KEY: minioadmin
          TEST_S3_USE_SSL: "false"
        run: go test -v -tags=integration -coverprofile=coverage-integration.out ./...

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/backend/coverage-integration.out
          flags: backend-integration
          name: backend-integration-coverage

  validate-migrations:
    name: Validate Migration Checksums
    runs-on: ubuntu-latest
    # Always runs but only validates on main push (skips with success otherwise)
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration checksums
        working-directory: apps/backend/migrations
        run: |
          # Skip validation for non-main branches (but don't fail)
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "⏭️ Skipping migration validation (not a push to main)"
            echo "Branch: ${{ github.ref }}"
            echo "Event: ${{ github.event_name }}"
            exit 0
          fi

          echo "=== Validating migration checksums ==="
          echo "This ensures migrations are immutable after deployment"
          echo ""
          
          if [ ! -f checksums.sha256 ]; then
            echo "❌ ERROR: checksums.sha256 not found!"
            echo "Run: make migration-checksums"
            exit 1
          fi
          
          echo "Checking checksums..."
          grep -v "^#" checksums.sha256 | shasum -a 256 -c -
          
          echo ""
          echo "✅ All migration checksums valid!"

      - name: List migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/backend/migrations
        run: |
          echo "### Migration Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in *.sql; do
            checksum=$(shasum -a 256 "$f" | cut -d' ' -f1 | head -c 12)
            echo "- \`$f\` (${checksum}...)" >> $GITHUB_STEP_SUMMARY
          done

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, validate-migrations]
    # Run only on push to main AND only if all dependencies succeeded
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' &&
      needs.unit-tests.result == 'success' &&
      needs.integration-tests.result == 'success' &&
      needs.validate-migrations.result == 'success'
    environment: staging
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          echo "lowercase_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "ycr_repo=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ secrets.YCR_REPOSITORY }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo "/opt/yc/bin" >> $GITHUB_PATH

      - name: Login to Yandex Container Registry
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}' > /tmp/yc-key.json
          /opt/yc/bin/yc config set service-account-key /tmp/yc-key.json
          /opt/yc/bin/yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          IAM_TOKEN=$(/opt/yc/bin/yc iam create-token)
          echo "${IAM_TOKEN}" | docker login --username iam --password-stdin cr.yandex
          rm -f /tmp/yc-key.json

      - name: Build and push to GHCR and YCR
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.lowercase_owner }}/landly/backend:main
            ghcr.io/${{ steps.vars.outputs.lowercase_owner }}/landly/backend:sha-${{ github.sha }}
            ${{ steps.vars.outputs.ycr_repo }}:main
            ${{ steps.vars.outputs.ycr_repo }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  migrate-staging:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Show pending migrations (dry-run)
        env:
          LANDLY_DATABASE_POSTGRES_HOST: ${{ secrets.LANDLY_DATABASE_POSTGRES_HOST }}
          LANDLY_DATABASE_POSTGRES_PORT: ${{ secrets.LANDLY_DATABASE_POSTGRES_PORT }}
          LANDLY_DATABASE_POSTGRES_USER: ${{ secrets.LANDLY_DATABASE_POSTGRES_USER }}
          LANDLY_DATABASE_POSTGRES_PASSWORD: ${{ secrets.LANDLY_DATABASE_POSTGRES_PASSWORD }}
          LANDLY_DATABASE_POSTGRES_DBNAME: ${{ secrets.LANDLY_DATABASE_POSTGRES_DBNAME }}
          LANDLY_DATABASE_POSTGRES_SSLMODE: ${{ secrets.LANDLY_DATABASE_POSTGRES_SSLMODE }}
        run: |
          DSN="postgres://${LANDLY_DATABASE_POSTGRES_USER}:${LANDLY_DATABASE_POSTGRES_PASSWORD}@${LANDLY_DATABASE_POSTGRES_HOST}:${LANDLY_DATABASE_POSTGRES_PORT}/${LANDLY_DATABASE_POSTGRES_DBNAME}?sslmode=${LANDLY_DATABASE_POSTGRES_SSLMODE}"
          
          echo "=== Migration Status (dry-run) ==="
          goose -dir apps/backend/migrations postgres "$DSN" status
          
          echo ""
          echo "=== Pending Migrations ==="
          PENDING=$(goose -dir apps/backend/migrations postgres "$DSN" status | grep -c "Pending" || true)
          echo "Pending migrations: $PENDING"
          
          if [ "$PENDING" -gt 0 ]; then
            echo "⚠️ There are $PENDING pending migration(s) to apply"
          else
            echo "✅ No pending migrations"
          fi

      - name: Apply migrations
        env:
          LANDLY_DATABASE_POSTGRES_HOST: ${{ secrets.LANDLY_DATABASE_POSTGRES_HOST }}
          LANDLY_DATABASE_POSTGRES_PORT: ${{ secrets.LANDLY_DATABASE_POSTGRES_PORT }}
          LANDLY_DATABASE_POSTGRES_USER: ${{ secrets.LANDLY_DATABASE_POSTGRES_USER }}
          LANDLY_DATABASE_POSTGRES_PASSWORD: ${{ secrets.LANDLY_DATABASE_POSTGRES_PASSWORD }}
          LANDLY_DATABASE_POSTGRES_DBNAME: ${{ secrets.LANDLY_DATABASE_POSTGRES_DBNAME }}
          LANDLY_DATABASE_POSTGRES_SSLMODE: ${{ secrets.LANDLY_DATABASE_POSTGRES_SSLMODE }}
        run: |
          DSN="postgres://${LANDLY_DATABASE_POSTGRES_USER}:${LANDLY_DATABASE_POSTGRES_PASSWORD}@${LANDLY_DATABASE_POSTGRES_HOST}:${LANDLY_DATABASE_POSTGRES_PORT}/${LANDLY_DATABASE_POSTGRES_DBNAME}?sslmode=${LANDLY_DATABASE_POSTGRES_SSLMODE}"
          
          echo "=== Applying Migrations ==="
          goose -dir apps/backend/migrations postgres "$DSN" up
          
          echo ""
          echo "=== Final Status ==="
          goose -dir apps/backend/migrations postgres "$DSN" status

      - name: Migration summary
        run: |
          echo "### Migration Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Database:** \`${{ secrets.LANDLY_DATABASE_POSTGRES_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Migrations applied" >> $GITHUB_STEP_SUMMARY

  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, migrate-staging]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Validate required secrets
        env:
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_SERVICE_ACCOUNT_ID: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
          YC_CONTAINER_ID: ${{ secrets.YC_CONTAINER_ID }}
          YCR_REPOSITORY: ${{ secrets.YCR_REPOSITORY }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          set -euo pipefail
          echo "=== Validating required secrets (lengths only) ==="
          
          errors=0
          
          check_secret() {
            local name="$1"
            local value="$2"
            local len="${#value}"
            echo "$name length: $len"
            if [ "$len" -eq 0 ]; then
              echo "❌ ERROR: $name is empty!"
              errors=$((errors + 1))
            fi
          }
          
          check_secret "YC_FOLDER_ID" "$YC_FOLDER_ID"
          check_secret "YC_REGISTRY_ID" "$YC_REGISTRY_ID"
          check_secret "YC_SERVICE_ACCOUNT_KEY_JSON" "$YC_SERVICE_ACCOUNT_KEY_JSON"
          check_secret "YC_SERVICE_ACCOUNT_ID" "$YC_SERVICE_ACCOUNT_ID"
          check_secret "YC_CONTAINER_ID" "$YC_CONTAINER_ID"
          check_secret "YCR_REPOSITORY" "$YCR_REPOSITORY"
          check_secret "STAGING_URL" "$STAGING_URL"
          check_secret "IMAGE_DIGEST" "$IMAGE_DIGEST"
          
          if [ "$errors" -gt 0 ]; then
            echo "❌ $errors required secret(s) missing. Aborting."
            exit 1
          fi
          echo "✅ All required secrets are set"

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo "/opt/yc/bin" >> $GITHUB_PATH

      - name: Authenticate with Yandex Cloud
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          echo "$YC_SERVICE_ACCOUNT_KEY_JSON" > /tmp/yc-key.json
          /opt/yc/bin/yc config set service-account-key /tmp/yc-key.json
          /opt/yc/bin/yc config set folder-id "$YC_FOLDER_ID"
          rm -f /tmp/yc-key.json
          
          # Verify YC context is set (without exposing secrets)
          echo "=== Verifying YC context ==="
          echo "Folder ID configured: ${YC_FOLDER_ID:0:8}..."
          /opt/yc/bin/yc resource-manager folder get --id "$YC_FOLDER_ID" --format json 2>/dev/null | jq -r '.name // "Folder access verified"' || echo "Folder access verified"

      - name: Deploy new revision to Serverless Container
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          YCR_REPOSITORY: ${{ secrets.YCR_REPOSITORY }}
          YC_CONTAINER_ID: ${{ secrets.YC_CONTAINER_ID }}
          YC_SERVICE_ACCOUNT_ID: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
          # App env vars
          LANDLY_AUTH_JWT_SECRET: ${{ secrets.LANDLY_AUTH_JWT_SECRET }}
          LANDLY_DATABASE_POSTGRES_HOST: ${{ secrets.LANDLY_DATABASE_POSTGRES_HOST }}
          LANDLY_DATABASE_POSTGRES_PORT: ${{ secrets.LANDLY_DATABASE_POSTGRES_PORT }}
          LANDLY_DATABASE_POSTGRES_USER: ${{ secrets.LANDLY_DATABASE_POSTGRES_USER }}
          LANDLY_DATABASE_POSTGRES_PASSWORD: ${{ secrets.LANDLY_DATABASE_POSTGRES_PASSWORD }}
          LANDLY_DATABASE_POSTGRES_DBNAME: ${{ secrets.LANDLY_DATABASE_POSTGRES_DBNAME }}
          LANDLY_DATABASE_POSTGRES_SSLMODE: ${{ secrets.LANDLY_DATABASE_POSTGRES_SSLMODE }}
          LANDLY_STORAGE_S3_ENDPOINT: ${{ secrets.LANDLY_STORAGE_S3_ENDPOINT }}
          LANDLY_STORAGE_S3_BUCKET: ${{ secrets.LANDLY_STORAGE_S3_BUCKET }}
          LANDLY_STORAGE_S3_ACCESS_KEY: ${{ secrets.LANDLY_STORAGE_S3_ACCESS_KEY }}
          LANDLY_STORAGE_S3_SECRET_KEY: ${{ secrets.LANDLY_STORAGE_S3_SECRET_KEY }}
          LANDLY_SERVER_CORS_ALLOWED_ORIGINS: ${{ secrets.LANDLY_SERVER_CORS_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          
          # Build image reference from secrets (not from job outputs)
          YCR_REPO="cr.yandex/${YC_REGISTRY_ID}/${YCR_REPOSITORY}"
          IMAGE="${YCR_REPO}@${IMAGE_DIGEST}"
          
          echo "=== Deploy diagnostics ==="
          echo "YCR_REPO length: ${#YCR_REPO}"
          echo "IMAGE_DIGEST length: ${#IMAGE_DIGEST}"
          echo "IMAGE length: ${#IMAGE}"
          echo "Deploying image (masked): ${IMAGE}"
          echo "Container ID length: ${#YC_CONTAINER_ID}"
          echo "Service Account ID length: ${#YC_SERVICE_ACCOUNT_ID}"
          
          # Create new container revision with all env vars
          /opt/yc/bin/yc serverless container revision deploy \
            --container-id "${YC_CONTAINER_ID}" \
            --image "${IMAGE}" \
            --service-account-id "${YC_SERVICE_ACCOUNT_ID}" \
            --execution-timeout 30s \
            --memory 512MB \
            --cores 1 \
            --concurrency 16 \
            --min-instances 0 \
            --environment "LANDLY_APP_ENV=production" \
            --environment "LANDLY_BOOTSTRAP_MODE=0" \
            --environment "LANDLY_AUTH_JWT_SECRET=${LANDLY_AUTH_JWT_SECRET}" \
            --environment "LANDLY_DATABASE_POSTGRES_HOST=${LANDLY_DATABASE_POSTGRES_HOST}" \
            --environment "LANDLY_DATABASE_POSTGRES_PORT=${LANDLY_DATABASE_POSTGRES_PORT}" \
            --environment "LANDLY_DATABASE_POSTGRES_USER=${LANDLY_DATABASE_POSTGRES_USER}" \
            --environment "LANDLY_DATABASE_POSTGRES_PASSWORD=${LANDLY_DATABASE_POSTGRES_PASSWORD}" \
            --environment "LANDLY_DATABASE_POSTGRES_DBNAME=${LANDLY_DATABASE_POSTGRES_DBNAME}" \
            --environment "LANDLY_DATABASE_POSTGRES_SSLMODE=${LANDLY_DATABASE_POSTGRES_SSLMODE}" \
            --environment "LANDLY_STORAGE_S3_ENDPOINT=${LANDLY_STORAGE_S3_ENDPOINT}" \
            --environment "LANDLY_STORAGE_S3_BUCKET=${LANDLY_STORAGE_S3_BUCKET}" \
            --environment "LANDLY_STORAGE_S3_ACCESS_KEY=${LANDLY_STORAGE_S3_ACCESS_KEY}" \
            --environment "LANDLY_STORAGE_S3_SECRET_KEY=${LANDLY_STORAGE_S3_SECRET_KEY}" \
            --environment "LANDLY_STORAGE_S3_USE_SSL=true" \
            --environment "LANDLY_SERVER_CORS_ALLOWED_ORIGINS=${LANDLY_SERVER_CORS_ALLOWED_ORIGINS}" \
            --environment "LANDLY_APP_BASE_URL=${STAGING_URL}"

      - name: Wait for revision to be active
        run: |
          echo "Waiting 15 seconds for revision to become active..."
          sleep 15

      - name: Smoke test - Health check
        run: |
          echo "Testing health endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_URL }}/health")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Health check failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Health check passed (HTTP $HTTP_STATUS)"

      - name: Smoke test - Readiness check
        run: |
          echo "Testing readiness endpoint..."
          RESPONSE=$(curl -s "${{ secrets.STAGING_URL }}/readyz")
          echo "Response: $RESPONSE"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_URL }}/readyz")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "⚠️ Readiness check returned $HTTP_STATUS (may be expected if DB not connected)"
          else
            echo "✅ Readiness check passed (HTTP $HTTP_STATUS)"
          fi

      - name: Deployment summary
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Container ID:** \`${{ secrets.YC_CONTAINER_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Digest:** \`${{ needs.build.outputs.image_digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ secrets.STAGING_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
