name: Frontend CI/CD

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-next.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'apps/frontend/**'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Run linter
        working-directory: apps/frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: apps/frontend
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/frontend/coverage/lcov.info
          flags: frontend-unit
          name: frontend-unit-coverage

      - name: Build
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner name
        id: owner
        run: echo "lowercase=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Login to YCR before build
      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo "/opt/yc/bin" >> $GITHUB_PATH

      - name: Login to Yandex Container Registry
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}' > /tmp/yc-key.json
          /opt/yc/bin/yc config set service-account-key /tmp/yc-key.json
          /opt/yc/bin/yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          IAM_TOKEN=$(/opt/yc/bin/yc iam create-token)
          echo "${IAM_TOKEN}" | docker login --username iam --password-stdin cr.yandex
          rm -f /tmp/yc-key.json

      - name: Build and push to GHCR and YCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lowercase }}/landly/frontend:main
            ghcr.io/${{ steps.owner.outputs.lowercase }}/landly/frontend:sha-${{ github.sha }}
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/landly-frontend:main
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/landly-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        run: |
          echo "Deployment step (configure your deployment here)"
          # Example: Upload to S3 or deploy to Vercel/Netlify
