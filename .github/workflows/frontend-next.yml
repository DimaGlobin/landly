name: Frontend CI/CD

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-next.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'apps/frontend/**'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Run linter
        working-directory: apps/frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: apps/frontend
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/frontend/coverage/lcov.info
          flags: frontend-unit
          name: frontend-unit-coverage

      - name: Build (test only)
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [unit-tests]
    # Run only on push to main AND only if tests succeeded
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/main' &&
      needs.unit-tests.result == 'success'
    environment: staging
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          echo "lowercase_owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "ycr_repo=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ secrets.YCR_FRONTEND_REPOSITORY }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo "/opt/yc/bin" >> $GITHUB_PATH

      - name: Login to Yandex Container Registry
        run: |
          echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}' > /tmp/yc-key.json
          /opt/yc/bin/yc config set service-account-key /tmp/yc-key.json
          /opt/yc/bin/yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          IAM_TOKEN=$(/opt/yc/bin/yc iam create-token)
          echo "${IAM_TOKEN}" | docker login --username iam --password-stdin cr.yandex
          rm -f /tmp/yc-key.json

      - name: Build and push to GHCR and YCR
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.lowercase_owner }}/landly/frontend:main
            ghcr.io/${{ steps.vars.outputs.lowercase_owner }}/landly/frontend:sha-${{ github.sha }}
            ${{ steps.vars.outputs.ycr_repo }}:main
            ${{ steps.vars.outputs.ycr_repo }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Validate required secrets
        env:
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_SERVICE_ACCOUNT_ID: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
          YC_FRONTEND_CONTAINER_ID: ${{ secrets.YC_FRONTEND_CONTAINER_ID }}
          YCR_FRONTEND_REPOSITORY: ${{ secrets.YCR_FRONTEND_REPOSITORY }}
          STAGING_FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          set -euo pipefail
          echo "=== Validating required secrets (lengths only) ==="
          
          errors=0
          
          check_secret() {
            local name="$1"
            local value="$2"
            local len="${#value}"
            echo "$name length: $len"
            if [ "$len" -eq 0 ]; then
              echo "❌ ERROR: $name is empty!"
              errors=$((errors + 1))
            fi
          }
          
          check_secret "YC_FOLDER_ID" "$YC_FOLDER_ID"
          check_secret "YC_REGISTRY_ID" "$YC_REGISTRY_ID"
          check_secret "YC_SERVICE_ACCOUNT_KEY_JSON" "$YC_SERVICE_ACCOUNT_KEY_JSON"
          check_secret "YC_SERVICE_ACCOUNT_ID" "$YC_SERVICE_ACCOUNT_ID"
          check_secret "YC_FRONTEND_CONTAINER_ID" "$YC_FRONTEND_CONTAINER_ID"
          check_secret "YCR_FRONTEND_REPOSITORY" "$YCR_FRONTEND_REPOSITORY"
          check_secret "STAGING_FRONTEND_URL" "$STAGING_FRONTEND_URL"
          check_secret "IMAGE_DIGEST" "$IMAGE_DIGEST"
          
          if [ "$errors" -gt 0 ]; then
            echo "❌ $errors required secret(s) missing. Aborting."
            exit 1
          fi
          echo "✅ All required secrets are set"

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo "/opt/yc/bin" >> $GITHUB_PATH

      - name: Authenticate with Yandex Cloud
        env:
          YC_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          echo "$YC_SERVICE_ACCOUNT_KEY_JSON" > /tmp/yc-key.json
          /opt/yc/bin/yc config set service-account-key /tmp/yc-key.json
          /opt/yc/bin/yc config set folder-id "$YC_FOLDER_ID"
          rm -f /tmp/yc-key.json
          
          # Verify YC context is set (without exposing secrets)
          echo "=== Verifying YC context ==="
          echo "Folder ID configured: ${YC_FOLDER_ID:0:8}..."
          /opt/yc/bin/yc resource-manager folder get --id "$YC_FOLDER_ID" --format json 2>/dev/null | jq -r '.name // "Folder access verified"' || echo "Folder access verified"

      - name: Deploy new revision to Serverless Container
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          YCR_FRONTEND_REPOSITORY: ${{ secrets.YCR_FRONTEND_REPOSITORY }}
          YC_FRONTEND_CONTAINER_ID: ${{ secrets.YC_FRONTEND_CONTAINER_ID }}
          YC_SERVICE_ACCOUNT_ID: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          set -euo pipefail
          
          # Build image reference from secrets (not from job outputs)
          YCR_REPO="cr.yandex/${YC_REGISTRY_ID}/${YCR_FRONTEND_REPOSITORY}"
          IMAGE="${YCR_REPO}@${IMAGE_DIGEST}"
          
          echo "=== Deploy diagnostics ==="
          echo "YCR_REPO length: ${#YCR_REPO}"
          echo "IMAGE_DIGEST length: ${#IMAGE_DIGEST}"
          echo "IMAGE length: ${#IMAGE}"
          echo "Deploying image (masked): ${IMAGE}"
          echo "Container ID length: ${#YC_FRONTEND_CONTAINER_ID}"
          echo "Service Account ID length: ${#YC_SERVICE_ACCOUNT_ID}"
          
          # Create new container revision
          /opt/yc/bin/yc serverless container revision deploy \
            --container-id "${YC_FRONTEND_CONTAINER_ID}" \
            --image "${IMAGE}" \
            --service-account-id "${YC_SERVICE_ACCOUNT_ID}" \
            --execution-timeout 30s \
            --memory 512MB \
            --cores 1 \
            --concurrency 16 \
            --min-instances 0

      - name: Wait for revision to be active
        run: |
          echo "Waiting 15 seconds for revision to become active..."
          sleep 15

      - name: Smoke test - Homepage
        run: |
          echo "Testing frontend homepage..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_FRONTEND_URL }}")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Frontend smoke test failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Frontend smoke test passed (HTTP $HTTP_STATUS)"

      - name: Deployment summary
        run: |
          echo "### Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Container ID:** \`${{ secrets.YC_FRONTEND_CONTAINER_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Digest:** \`${{ needs.build.outputs.image_digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ secrets.STAGING_FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
