services:
  # Nginx API Gateway - routes /v1/* to backend, everything else to frontend
  nginx:
    image: nginx:alpine
    container_name: landly-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: landly-postgres
    environment:
      POSTGRES_USER: landly
      POSTGRES_PASSWORD: landly
      POSTGRES_DB: landly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landly"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: landly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: landly-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: landly-backend
    environment:
      LANDLY_APP_ENV: development
      LANDLY_AUTH_JWT_SECRET: dev-secret-change-in-production-please
      LANDLY_DATABASE_POSTGRES_HOST: postgres
      LANDLY_DATABASE_POSTGRES_PORT: 5432
      LANDLY_DATABASE_POSTGRES_USER: landly
      LANDLY_DATABASE_POSTGRES_PASSWORD: landly
      LANDLY_DATABASE_POSTGRES_DBNAME: landly
      LANDLY_DATABASE_POSTGRES_SSLMODE: disable
      LANDLY_STORAGE_S3_BUCKET: landly-sites
      LANDLY_STORAGE_S3_ENDPOINT: minio:9000
      LANDLY_STORAGE_S3_ACCESS_KEY: minioadmin
      LANDLY_STORAGE_S3_SECRET_KEY: minioadmin
      LANDLY_STORAGE_S3_USE_SSL: "false"
      LANDLY_APP_BASE_URL: http://localhost
      WAIT_FOR_DB: 1
      RUN_MIGRATIONS: 1
    # No external port - accessed via nginx
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.frontend
    container_name: landly-frontend
    # Only accessible via nginx (port 80)
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend-builder:
    profiles: ["test"]
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.backend
      target: builder
    working_dir: /build
    entrypoint: ["/bin/sh", "-c"]
    command: ["go test ./..."]
    environment: []

  frontend-tester:
    profiles: ["test"]
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.frontend
      target: builder
    working_dir: /app
    entrypoint: ["npm", "run", "test:ci"]

  # Prometheus - Metrics collection
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.48.0
    container_name: landly-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - backend
    restart: unless-stopped

  # Grafana - Metrics visualization
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:10.2.2
    container_name: landly-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
